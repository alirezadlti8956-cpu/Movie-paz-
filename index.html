<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مووی پز - Movie Paz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-950 font-sans text-right selection:bg-red-500 selection:text-white" style="font-family: Tahoma, Arial, sans-serif;">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      const Icon = ({ name, size = 20, className = "" }) => {
        const icons = {
          film: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18"/><path d="M17 3v18"/><path d="M3 7h4"/><path d="M3 12h18"/><path d="M3 17h4"/><path d="M17 17h4"/><path d="M17 7h4"/></svg>,
          home: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
          user: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
          logout: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>,
          play: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="6 3 20 12 6 21 6 3"/></svg>,
          search: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,
          info: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>,
          download: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>,
          listvideo: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 12H3"/><path d="M16 6H3"/><path d="M12 18H3"/><path d="m16 12 5 3-5 3v-6Z"/></svg>,
          monitor: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>,
          shield: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,
          bookmark: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
        };
        return icons[name] || null;
      };

      function App() {
        const [currentView, setCurrentView] = useState('home');
        const [currentUser, setCurrentUser] = useState(null);
        const [selectedMovie, setSelectedMovie] = useState(null);
        const [activeEpisode, setActiveEpisode] = useState(null);
        const [searchQuery, setSearchQuery] = useState('');
        const [message, setMessage] = useState({ text: '', type: '' });

        const [watchlist, setWatchlist] = useState(() => {
          const saved = localStorage.getItem('moviepaz_watchlist');
          return saved ? JSON.parse(saved) : [];
        });
        const [selectedType, setSelectedType] = useState('all');
        const [selectedGenre, setSelectedGenre] = useState('all');

        const genresList = ['اکشن', 'علمی تخیلی', 'کمدی', 'درام', 'ترسناک', 'عاشقانه', 'هیجانی', 'مستند', 'فانتزی', 'معمایی'];
        const typesList = [
          { id: 'movie', name: 'فیلم سینمایی' },
          { id: 'series', name: 'سریال' },
          { id: 'anime', name: 'انیمه' },
          { id: 'animation', name: 'انیمیشن' }
        ];

        useEffect(() => {
          localStorage.setItem('moviepaz_watchlist', JSON.stringify(watchlist));
        }, [watchlist]);

        const [movies, setMovies] = useState([
          {
            id: 1,
            title: 'متری شیش و نیم',
            type: 'movie', 
            genres: ['اکشن', 'درام'],
            imageUrl: 'https://upload.wikimedia.org/wikipedia/fa/thumb/8/87/Just_6.5.jpg/220px-Just_6.5.jpg',
            description: 'داستان یک پلیس مبارزه با مواد مخدر که به دنبال بزرگترین قاچاقچی شیشه در تهران است.',
            videoUrl: 'https://www.w3schools.com/html/mov_bbb.mp4',
            downloadUrl: 'https://www.w3schools.com/html/mov_bbb.mp4'
          },
          {
            id: 2,
            title: 'قهوه تلخ',
            type: 'series',
            genres: ['کمدی', 'درام'],
            imageUrl: 'https://upload.wikimedia.org/wikipedia/fa/thumb/1/1d/Ghahveye-talkh.jpg/250px-Ghahveye-talkh.jpg',
            description: 'استاد تاریخ به نام نیما زند کریمی با خوردن یک فنجان قهوه تلخ به تاریخ سفر می‌کند.',
            episodes: [
              { id: 201, season: 1, episode: 1, videoUrl: 'https://www.w3schools.com/html/mov_bbb.mp4', downloadUrl: 'https://www.w3schools.com/html/mov_bbb.mp4' },
              { id: 202, season: 1, episode: 2, videoUrl: 'https://www.w3schools.com/html/mov_bbb.mp4', downloadUrl: 'https://www.w3schools.com/html/mov_bbb.mp4' }
            ]
          },
          {
            id: 3,
            title: 'اتک آن تایتان (Attack on Titan)',
            type: 'anime',
            genres: ['اکشن', 'فانتزی', 'معمایی'],
            imageUrl: 'https://upload.wikimedia.org/wikipedia/en/d/d6/Shingeki_no_Kyojin_manga_volume_1.jpg',
            description: 'بشریت برای فرار از دست تایتان‌های آدم‌خوار، خود را درون دیوارهایی غول‌پیکر حبس کرده است...',
            episodes: [
              { id: 301, season: 1, episode: 1, videoUrl: 'https://www.w3schools.com/html/mov_bbb.mp4', downloadUrl: 'https://www.w3schools.com/html/mov_bbb.mp4' }
            ]
          }
        ]);

        const [authForm, setAuthForm] = useState({ username: '', password: '' });
        const [newMedia, setNewMedia] = useState({ title: '', type: 'movie', genres: [], imageUrl: '', description: '', videoUrl: '', downloadUrl: '' });
        const [newEpisode, setNewEpisode] = useState({ seriesId: '', season: 1, episode: 1, videoUrl: '', downloadUrl: '' });

        const showMessage = (text, type = 'success') => {
          setMessage({ text, type });
          setTimeout(() => setMessage({ text: '', type: '' }), 4000);
        };

        const handleAuth = (e, isLogin) => {
          e.preventDefault();
          if (authForm.username && authForm.password) {
            const isAdmin = authForm.username.toLowerCase() === 'alireza_dlti';
            setCurrentUser({ username: authForm.username, isAdmin });
            if (isAdmin) {
              showMessage('خوش آمدید مدیر سایت (علیرضا)! دسترسی مدیریت باز شد.');
            } else {
              showMessage(isLogin ? 'با موفقیت وارد شدید.' : 'ثبت نام با موفقیت انجام شد!');
            }
            setCurrentView('home');
            setAuthForm({ username: '', password: '' });
          } else {
            showMessage('لطفا نام کاربری و رمز عبور را وارد کنید', 'error');
          }
        };

        const handleLogout = () => {
          setCurrentUser(null);
          showMessage('با موفقیت خارج شدید');
          setCurrentView('home');
        };

        const toggleWatchlist = (movie) => {
          if (!currentUser) {
            showMessage('برای ذخیره فیلم ابتدا وارد سایت شوید', 'error');
            setCurrentView('login');
            return;
          }
          setWatchlist(prev => {
            if (prev.find(m => m.id === movie.id)) {
              showMessage('از لیست تماشای شما حذف شد');
              return prev.filter(m => m.id !== movie.id);
            } else {
              showMessage('به لیست تماشای شما اضافه شد');
              return [...prev, movie];
            }
          });
        };

        const handleAddMedia = (e) => {
          e.preventDefault();
          if (!newMedia.title) {
            showMessage('عنوان اجباری است!', 'error');
            return;
          }
          if (newMedia.genres.length === 0) {
            showMessage('حداقل یک ژانر انتخاب کنید!', 'error');
            return;
          }
          const mediaToAdd = {
            ...newMedia,
            id: Date.now(),
            imageUrl: newMedia.imageUrl || 'https://via.placeholder.com/300x450?text=No+Cover',
            episodes: (newMedia.type === 'series' || newMedia.type === 'anime') ? [] : undefined
          };
          setMovies([mediaToAdd, ...movies]);
          showMessage(`«${newMedia.title}» با موفقیت اضافه شد!`);
          setNewMedia({ title: '', type: 'movie', genres: [], imageUrl: '', description: '', videoUrl: '', downloadUrl: '' });
        };

        const handleAddEpisode = (e) => {
          e.preventDefault();
          if (!newEpisode.seriesId || !newEpisode.videoUrl) {
            showMessage('انتخاب سریال و لینک پخش اجباری است!', 'error');
            return;
          }
          const updatedMovies = movies.map(movie => {
            if (movie.id === parseInt(newEpisode.seriesId)) {
              const episodeToAdd = {
                id: Date.now(),
                season: parseInt(newEpisode.season),
                episode: parseInt(newEpisode.episode),
                videoUrl: newEpisode.videoUrl,
                downloadUrl: newEpisode.downloadUrl || newEpisode.videoUrl
              };
              return { ...movie, episodes: [...(movie.episodes || []), episodeToAdd] };
            }
            return movie;
          });
          setMovies(updatedMovies);
          showMessage(`قسمت ${newEpisode.episode} از فصل ${newEpisode.season} با موفقیت اضافه شد!`);
          setNewEpisode({ ...newEpisode, episode: parseInt(newEpisode.episode) + 1, videoUrl: '', downloadUrl: '' });
        };

        const playMedia = (media) => {
          setSelectedMovie(media);
          if ((media.type === 'series' || media.type === 'anime') && media.episodes && media.episodes.length > 0) {
            setActiveEpisode(media.episodes[0]);
          } else {
            setActiveEpisode(null);
          }
          setCurrentView('player');
        };

        const filteredMovies = movies.filter(m => {
          const matchSearch = m.title.includes(searchQuery);
          const matchType = selectedType === 'all' || m.type === selectedType;
          const matchGenre = selectedGenre === 'all' || m.genres?.includes(selectedGenre);
          return matchSearch && matchType && matchGenre;
        });

        const Navbar = () => (
          <nav className="bg-gray-900 border-b border-gray-800 text-white p-4 sticky top-0 z-50">
            <div className="max-w-6xl mx-auto flex justify-between items-center">
              <div className="text-2xl font-black text-red-600 cursor-pointer flex items-center gap-2" onClick={() => setCurrentView('home')}>
                <Icon name="film" size={28} /> مووی پز
              </div>
              <div className="flex items-center gap-4 text-sm">
                {currentUser ? (
                  <>
                    {currentUser.isAdmin && (
                      <button onClick={() => setCurrentView('admin')} className="hidden sm:flex items-center gap-1 bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded-lg transition font-bold">
                        <Icon name="monitor" size={16} /> پنل مدیریت
                      </button>
                    )}
                    <div className="flex items-center gap-2 text-gray-300 bg-gray-800 px-3 py-1.5 rounded-lg border border-gray-700">
                      <Icon name="user" size={18} />
                      <span className="hidden sm:inline font-bold">{currentUser.username} {currentUser.isAdmin && '(مدیر)'}</span>
                    </div>
                    <button onClick={handleLogout} className="text-gray-400 hover:text-red-500 transition"><Icon name="logout" size={20} /></button>
                  </>
                ) : (
                  <button onClick={() => setCurrentView('login')} className="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg font-bold transition flex items-center gap-2 shadow-lg">
                    <Icon name="user" size={18} /> ورود / ثبت‌نام
                  </button>
                )}
              </div>
            </div>
          </nav>
        );

        const HomeView = () => (
          <div className="p-4 max-w-6xl mx-auto pb-24 sm:pb-4">
            <div className="bg-gray-800 p-4 rounded-2xl shadow-lg border border-gray-700 mb-8 mt-4">
              <div className="relative mb-4">
                <div className="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none"><Icon name="search" size={20} className="text-gray-400" /></div>
                <input type="text" className="w-full bg-gray-900 border border-gray-600 text-white rounded-xl py-3 pr-10 pl-4 focus:outline-none focus:border-red-500" placeholder="جستجوی نام فیلم، سریال، انیمه..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} />
              </div>
              <div className="flex gap-2 overflow-x-auto pb-2 mb-3">
                <button onClick={() => setSelectedType('all')} className={`whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-bold transition ${selectedType === 'all' ? 'bg-red-600 text-white' : 'bg-gray-700 text-gray-300'}`}>همه موارد</button>
                {typesList.map(type => (
                  <button key={type.id} onClick={() => setSelectedType(type.id)} className={`whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-bold transition ${selectedType === type.id ? 'bg-red-600 text-white' : 'bg-gray-700 text-gray-300'}`}>{type.name}</button>
                ))}
              </div>
              <div className="flex gap-2 overflow-x-auto pb-2 border-t border-gray-700 pt-3">
                <button onClick={() => setSelectedGenre('all')} className={`whitespace-nowrap px-3 py-1 rounded-lg text-xs font-bold transition ${selectedGenre === 'all' ? 'bg-blue-600 text-white' : 'bg-gray-900 text-gray-400'}`}>همه ژانرها</button>
                {genresList.map(genre => (
                  <button key={genre} onClick={() => setSelectedGenre(genre)} className={`whitespace-nowrap px-3 py-1 rounded-lg text-xs font-bold transition ${selectedGenre === genre ? 'bg-blue-600 text-white' : 'bg-gray-900 text-gray-400 border border-gray-700'}`}>{genre}</button>
                ))}
              </div>
            </div>
            <h2 className="text-xl font-bold text-white mb-6 flex items-center gap-2"><span className="w-2 h-6 bg-red-600 rounded-full inline-block"></span>تازه‌ترین‌های مووی پز</h2>
            {filteredMovies.length === 0 ? (
              <div className="text-center text-gray-400 py-12"><p>محتوایی پیدا نشد!</p></div>
            ) : (
              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                {filteredMovies.map(movie => (
                  <div key={movie.id} className="bg-gray-800 rounded-xl overflow-hidden cursor-pointer group hover:-translate-y-2 transition duration-300 shadow-lg border border-gray-700" onClick={() => playMedia(movie)}>
                    <div className="relative aspect-[2/3]">
                      <img src={movie.imageUrl} alt={movie.title} className="w-full h-full object-cover" />
                      <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center"><Icon name="play" size={48} className="text-white" /></div>
                      <div className="absolute top-2 right-2 bg-gray-900/80 text-white text-[10px] font-bold px-2 py-1 rounded">{typesList.find(t => t.id === movie.type)?.name}</div>
                    </div>
                    <div className="p-3"><h3 className="text-white font-semibold text-sm truncate">{movie.title}</h3></div>
                  </div>
                ))}
              </div>
            )}
          </div>
        );

        const PlayerView = () => {
          const currentVideoSrc = selectedMovie?.type === 'movie' ? selectedMovie.videoUrl : activeEpisode?.videoUrl;
          const currentDownloadSrc = selectedMovie?.type === 'movie' ? selectedMovie.downloadUrl : activeEpisode?.downloadUrl;
          return (
            <div className="max-w-4xl mx-auto p-4 pb-24">
              <button onClick={() => setCurrentView('home')} className="text-gray-400 hover:text-white mb-4 flex items-center gap-2 bg-gray-800 px-4 py-2 rounded-lg w-fit">بازگشت به لیست</button>
              <div className="bg-black w-full aspect-video rounded-xl overflow-hidden shadow-2xl relative mb-6 border border-gray-800">
                {currentVideoSrc ? <video controls className="w-full h-full object-contain bg-black" src={currentVideoSrc} poster={selectedMovie?.imageUrl}></video> : <p className="text-white text-center pt-20">ویدیویی یافت نشد.</p>}
              </div>
              {currentDownloadSrc && <a href={currentDownloadSrc} target="_blank" rel="noreferrer" className="w-full flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl mb-6 shadow-lg"><Icon name="download" size={24} /> دانلود با لینک مستقیم</a>}
              <div className="bg-gray-800 rounded-xl p-5 shadow-lg border border-gray-700 mb-6 relative">
                <button onClick={() => toggleWatchlist(selectedMovie)} className="absolute top-5 left-5 bg-gray-700 hover:bg-gray-600 p-2 rounded-full"><Icon name="bookmark" size={24} className={watchlist.find(m => m.id === selectedMovie?.id) ? 'text-green-400' : 'text-gray-300'} /></button>
                <div className="flex gap-6">
                  <img src={selectedMovie?.imageUrl} alt="" className="w-32 h-48 object-cover rounded-lg hidden sm:block" />
                  <div>
                    <h1 className="text-2xl font-bold text-white mb-2">{selectedMovie?.title}</h1>
